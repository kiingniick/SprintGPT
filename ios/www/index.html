<!doctype html>
<!--
  Fallback shell for the Capacitor iOS app.

  The app normally loads the live Paceloop server directly (see the "server.url"
  field in capacitor.config.json), so this file is almost never shown. It only
  appears if the device is offline before the remote site has ever loaded.
  Capacitor still requires a non-empty webDir at build time, so keep this here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0; url=https://kiingniick.github.io/SprintGPT/" />
    <title>Paceloop</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        color: #e6edf3;
        font-family: -apple-system, system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      a { color: #22d3ee; }
    </style>
  </head>
  <body>
    <div>
      <h1>Paceloop</h1>
      <p>Connecting to the server…</p>
      <p><a href="https://kiingniick.github.io/SprintGPT/">Tap here if nothing happens</a></p>
    </div>
  </body>
</html>
