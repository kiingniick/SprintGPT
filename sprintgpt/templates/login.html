{% extends "base.html" %}
{% block title %}Log in - Paceloop{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand-mark hero-mark">P</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to see your runs, fitness, and training plan.</p>

    <form class="form-grid" method="post" action="{{ url_for('login') }}">
      <div>
        <label>Email</label>
        <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div>
        <label>Password</label>
        <input name="password" type="password" placeholder="Your password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
    </form>

    <p class="auth-alt"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
    <p class="auth-alt">New here? <a href="{{ url_for('signup') }}">Create a free account</a></p>
  </div>
</div>
{% endblock %}
