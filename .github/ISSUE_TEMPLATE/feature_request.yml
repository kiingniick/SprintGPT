name: "💡 Feature idea"
description: "Something that would make Paceloop go even more brrrrrr"
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got a big-brain idea? Let's hear it. 🧠✨
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What do you want it to do?
      placeholder: "It'd be sick if Paceloop could..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What problem does it solve for runners?
      placeholder: "Right now I have to ... which is annoying because ..."
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, links, examples from other apps, memes — all welcome.
